spring.application.name=leaguetrack-test

# H2 In-Memory Database for Unit & Integration Testing
spring.datasource.url=jdbc:h2:mem:leaguetrack_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Configurable League Scoring Rules
league.scoring.win=3
league.scoring.draw=1
league.scoring.loss=0
